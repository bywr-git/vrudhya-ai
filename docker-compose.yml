services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vrudhya
      POSTGRES_PASSWORD: vrudhya
      POSTGRES_DB: vrudhya
    ports:
      - "5432:5432"
    volumes:
      - vrudhya_pgdata:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrudhya -d vrudhya"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ENVIRONMENT: development
      DATA_MODE: synthetic
      DATABASE_URL: postgresql+asyncpg://vrudhya:vrudhya@postgres:5432/vrudhya
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vrudhya_pgdata:
